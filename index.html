<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="src/style.css" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
    <title>Emoji Invaders</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>"
    />
  </head>
  <body>
    <div class="app-wrapper">
      <header id="head">
        <h1 class="logo">EMOJI INVADERS</h1>
      </header>

      <main id="game" class="game-container">
        <div class="score-container">
          <div id="score-label">Score:</div>
          <div id="score"></div>
          <div id="level-label">Level:</div>
          <div id="level"></div>
        </div>

        <div id="player" class="player">🌋</div>
        <div id="shot" class="shot hidden">🔥</div>
        <audio
          id="audio-d"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15MELCCFAWncX2dOhGFY1UlLrwpVRb3P0mKTD9W"
        ></audio>
        <audio
          id="audio-c"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15MTjeSB4OrmVsO7l0rWoM8iNIkDYAKgEBy6GFd"
        ></audio>
        <audio
          id="audio-asharp"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15MxjBs1WzZth0fcq1Apm2dIjRSvgVGiDNyulQr"
        ></audio>
        <audio
          id="audio-a"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15Mmuil9d348JQuRjBOr1TNcD2VtmeAKoiPHYGa"
        ></audio>
        <audio
          id="pew"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15Mq79UTxlZGu6aoXNvSnxmKD3lCIhHO5z2FtTU"
        ></audio>
        <audio
          id="boom"
          volume="0.01"
          src="https://7xfjojyq0f.ufs.sh/f/GpRzKlFTl15M4dijzGxd2cvWypX38lLqxZEmJbsCag5uYHSz"
        ></audio>
      </main>

      <footer>
        <div class="instructions">Left and Right Arrows, Spacebar to fire!</div>
        <div><button class="control-btn" id="play-btn">Play!</button></div>
      </footer>
      <div class="warn">WARNING: STILL A LOT OF BUGS!</div>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
